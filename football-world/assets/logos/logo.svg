<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#087F46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer circle ring -->
  <circle cx="50" cy="50" r="46" fill="#101613" stroke="url(#logoGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="50" cy="50" r="42" fill="#080B0A" />
  
  <!-- Football Pattern -->
  <!-- Center Pentagon -->
  <polygon points="50,34 62,43 57,57 43,57 38,43" fill="#00D26A" />
  <!-- Radiating Lines & Outer Hexagons -->
  <line x1="50" y1="34" x2="50" y2="20" stroke="#A0AAA4" stroke-width="2.5" />
  <line x1="62" y1="43" x2="74" y2="40" stroke="#A0AAA4" stroke-width="2.5" />
  <line x1="57" y1="57" x2="68" y2="68" stroke="#A0AAA4" stroke-width="2.5" />
  <line x1="43" y1="57" x2="32" y2="68" stroke="#A0AAA4" stroke-width="2.5" />
  <line x1="38" y1="43" x2="26" y2="40" stroke="#A0AAA4" stroke-width="2.5" />

  <!-- Outer patches -->
  <polygon points="44,14 56,14 50,20" fill="#101613" stroke="#A0AAA4" stroke-width="2" />
  <polygon points="78,34 84,46 74,40" fill="#101613" stroke="#A0AAA4" stroke-width="2" />
  <polygon points="68,68 76,78 62,78" fill="#101613" stroke="#A0AAA4" stroke-width="2" />
  <polygon points="32,68 24,78 38,78" fill="#101613" stroke="#A0AAA4" stroke-width="2" />
  <polygon points="22,34 16,46 26,40" fill="#101613" stroke="#A0AAA4" stroke-width="2" />
  
  <!-- Ball glow ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#00D26A" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
</svg>